services:
  - type: web
    name: threatpath-ai
    env: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: cd threatpath/backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.x
